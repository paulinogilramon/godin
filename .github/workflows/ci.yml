name: CI

on:
  push:
  pull_request:

env:
  GOLANGCI_VERSION: v2.14.0
  ODIN_VERSION: dev-2026-10

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: ${{ env.ODIN_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Format check
        run: pwsh -NoProfile -File godin.ps1 fmt-check

      - name: Lint
        run: pwsh -NoProfile -File godin.ps1 lint

      - name: Build & test
        run: pwsh -NoProfile -File godin.ps1 build; pwsh -NoProfile -File godin.ps1 test

      - name: Coverage
        run: pwsh -NoProfile -File godin.ps1 cover

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: build/coverage.out

      - name: Smoke test
        run: pwsh -NoProfile -File godin.ps1 run

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: ${{ env.ODIN_VERSION }}

      - name: Install clang (Odin linker driver on Linux)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Format check
        run: pwsh -NoProfile -File godin.ps1 fmt-check

      - name: Lint
        run: pwsh -NoProfile -File godin.ps1 lint

      - name: Build & test
        run: pwsh -NoProfile -File godin.ps1 build; pwsh -NoProfile -File godin.ps1 test

      - name: Coverage
        run: pwsh -NoProfile -File godin.ps1 cover

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: build/coverage.out

      - name: Smoke test
        run: pwsh -NoProfile -File godin.ps1 run
