name: CI

on:
  push:
  pull_request:

env:
  GOLANGCI_VERSION: v2.14.0
  ODIN_VERSION: dev-2026-10

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: ${{ env.ODIN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Format check
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Build & test
        run: just build && just test

      - name: Coverage
        run: just cover

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: build/coverage.out

      - name: Smoke test
        run: just run

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: ${{ env.ODIN_VERSION }}

      - name: Install clang (Odin linker driver on Linux)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Build
        run: |
          mkdir -p build
          odin build odin -build-mode:shared -out:build/libgodin.so
          go build -C go -o ../build/app .

      - name: Lint
        working-directory: go
        run: golangci-lint run

      - name: Test with coverage
        env:
          CGO_ENABLED: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: go test -C go -covermode=atomic -coverprofile=build/coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: build/coverage.out

      - name: Smoke test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: ./build/app
