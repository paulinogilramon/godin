name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: 'dev-2026-10'

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Build, lint & test
        run: just fmt && just lint && just build && just test

      - name: Smoke test
        run: just run

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: 'dev-2026-10'

      - name: Install clang (Odin linker driver on Linux)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        run: |
          mkdir -p build
          odin build odin -build-mode:shared -out:build/libgodin.so
          go build -C go -o ../build/app .

      - name: Test
        env:
          CGO_ENABLED: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: go test -C go ./...

      - name: Smoke test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: ./build/app
